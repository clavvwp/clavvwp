name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: clavvwp
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push Snake Animation
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}


  commit-strike:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update commit strike file
        run: |
          echo "Daily commit strike generated on $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > commit-strike.txt

      - name: Commit and push changes
        uses: EndBug/add-and-commit@v9
        with:
          message: "🔥 Daily commit strike"
          add: "commit-strike.txt"
